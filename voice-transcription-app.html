<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声録音・文字起こし</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .notice {
            background: #fef3c7;
            color: #92400e;
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #fbbf24;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
        }
        
        .controls {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
        }
        
        button {
            font-size: 18px;
            padding: 15px 40px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        #startBtn {
            background: #10b981;
            color: white;
        }
        
        #startBtn:hover:not(:disabled) {
            background: #059669;
            transform: translateY(-2px);
        }
        
        #stopBtn {
            background: #ef4444;
            color: white;
        }
        
        #stopBtn:hover:not(:disabled) {
            background: #dc2626;
            transform: translateY(-2px);
        }
        
        #clearBtn {
            background: #f59e0b;
            color: white;
        }
        
        #clearBtn:hover:not(:disabled) {
            background: #d97706;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 20px;
            font-size: 20px;
            color: #374151;
            font-weight: bold;
        }
        
        .recording {
            color: #ef4444;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .visualizer-container {
            margin-top: 20px;
            display: none;
        }
        
        .visualizer-container.active {
            display: block;
        }
        
        #visualizer {
            width: 100%;
            height: 150px;
            background: #1f2937;
            border-radius: 10px;
        }
        
        .volume-meter {
            margin-top: 15px;
            text-align: center;
        }
        
        .volume-bar {
            width: 80%;
            height: 30px;
            background: #e5e7eb;
            border-radius: 15px;
            margin: 10px auto;
            overflow: hidden;
            position: relative;
        }
        
        .volume-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6, #ef4444);
            width: 0%;
            transition: width 0.1s;
            border-radius: 15px;
        }
        
        .transcription-area {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .transcript-item {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .transcript-item:last-child {
            border-bottom: none;
        }
        
        .japanese {
            font-size: 32pt;
            line-height: 1.6;
            color: #1f2937;
            margin-bottom: 15px;
        }
        
        .english {
            font-size: 28pt;
            line-height: 1.6;
            color: #6b7280;
            font-style: italic;
        }
        
        .empty-message {
            text-align: center;
            color: #9ca3af;
            font-size: 24pt;
            padding: 40px;
        }

        .interim {
            opacity: 0.6;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="notice">
            ⚠️ マイクの使用許可を求めるアラートが2回出る場合がありますが、2回とも許可してください。
        </div>
        <div class="controls">
            <button id="startBtn">🎤 録音・文字起こし開始</button>
            <button id="stopBtn" disabled>⏹️ 停止</button>
            <button id="clearBtn">🗑️ クリア</button>
            <div class="status" id="status">準備完了</div>
            
            <div class="visualizer-container" id="visualizerContainer">
                <canvas id="visualizer"></canvas>
                <div class="volume-meter">
                    <div class="volume-bar">
                        <div class="volume-fill" id="volumeFill"></div>
                    </div>
                    <div style="color: #374151; font-size: 16px;">音声レベル</div>
                </div>
            </div>
        </div>
        
        <div class="transcription-area" id="transcriptionArea">
            <div class="empty-message">録音・文字起こし開始ボタンを押してください</div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let recognition;
        let isRecording = false;
        let audioContext;
        let analyser;
        let microphone;
        let animationId;
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const status = document.getElementById('status');
        const transcriptionArea = document.getElementById('transcriptionArea');
        const visualizerContainer = document.getElementById('visualizerContainer');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const volumeFill = document.getElementById('volumeFill');
        
        let transcriptCount = 0;
        
        // 音声認識の初期化
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            console.log('webkitSpeechRecognitionを使用');
        } else if ('SpeechRecognition' in window) {
            recognition = new SpeechRecognition();
            console.log('SpeechRecognitionを使用');
        } else {
            alert('お使いのブラウザは音声認識に対応していません。Google Chromeをお使いください。');
        }
        
        if (recognition) {
            recognition.lang = 'ja-JP';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
            
            recognition.onstart = () => {
                console.log('音声認識が開始されました');
                status.textContent = '🔴 録音・文字起こし中... (音声認識ON) - 大きな声で話してください';
            };
            
            recognition.onspeechstart = () => {
                console.log('音声を検出しました！');
            };
            
            recognition.onspeechend = () => {
                console.log('音声が終了しました');
            };
            
            recognition.onnomatch = () => {
                console.log('音声を認識できませんでした');
            };
            
            recognition.onresult = (event) => {
                console.log('音声認識結果を受信:', event.results.length);
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    const isFinal = event.results[i].isFinal;
                    const confidence = event.results[i][0].confidence;
                    
                    console.log('認識:', transcript, 'Final:', isFinal, 'Confidence:', confidence);
                    
                    if (isFinal) {
                        transcriptCount++;
                        displayTranscript(transcript, transcriptCount, false);
                    } else {
                        displayTranscript(transcript, transcriptCount + 1, true);
                    }
                }
            };
            
            recognition.onerror = (event) => {
                console.error('音声認識エラー:', event.error, event);
                
                // エラーの詳細をユーザーに表示
                let errorMsg = '';
                switch(event.error) {
                    case 'no-speech':
                        errorMsg = '音声が検出されませんでした。もう一度はっきりと話してください。';
                        break;
                    case 'audio-capture':
                        errorMsg = 'マイクにアクセスできません。';
                        break;
                    case 'not-allowed':
                        errorMsg = 'マイクの使用が許可されていません。';
                        break;
                    case 'network':
                        errorMsg = 'ネットワークエラーが発生しました。インターネット接続を確認してください。';
                        break;
                    default:
                        errorMsg = '音声認識エラー: ' + event.error;
                }
                
                status.textContent = errorMsg;
                
                // no-speechエラーは自動的に再試行
                if (event.error === 'no-speech' && isRecording) {
                    console.log('no-speechエラーのため再起動します');
                    setTimeout(() => {
                        if (isRecording) {
                            try {
                                recognition.start();
                            } catch (e) {
                                console.error('再起動失敗:', e);
                            }
                        }
                    }, 100);
                }
            };
            
            recognition.onend = () => {
                console.log('音声認識が終了しました。再起動:', isRecording);
                if (isRecording) {
                    // 少し待ってから再起動
                    setTimeout(() => {
                        if (isRecording) {
                            try {
                                recognition.start();
                                console.log('音声認識を再起動しました');
                            } catch (e) {
                                console.error('再起動エラー:', e);
                                // already startedエラーの場合は無視
                                if (e.message !== 'recognition already started') {
                                    console.error('予期しない再起動エラー:', e);
                                }
                            }
                        }
                    }, 100);
                }
            };
        }
        
        // Canvas サイズ設定
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 音声ビジュアライザー
        function visualize() {
            if (!analyser) return;
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            function draw() {
                if (!isRecording) return;
                
                animationId = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                
                // 音量レベル計算
                const average = dataArray.reduce((a, b) => a + b) / bufferLength;
                const volumePercent = (average / 255) * 100;
                volumeFill.style.width = volumePercent + '%';
                
                // 波形描画
                canvasCtx.fillStyle = '#1f2937';
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
                
                const barWidth = (canvas.width / bufferLength) * 2.5;
                let barHeight;
                let x = 0;
                
                for (let i = 0; i < bufferLength; i++) {
                    barHeight = (dataArray[i] / 255) * canvas.height;
                    
                    const red = (barHeight / canvas.height) * 255;
                    const green = 150;
                    const blue = 255 - red;
                    
                    canvasCtx.fillStyle = `rgb(${red},${green},${blue})`;
                    canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    
                    x += barWidth + 1;
                }
            }
            
            draw();
        }
        
        // 録音・文字起こし開始
        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // 音声解析の設定
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                analyser.fftSize = 256;
                
                // 録音の設定
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.start();
                isRecording = true;
                
                // 音声認識開始
                if (recognition) {
                    console.log('音声認識を開始します...');
                    try {
                        recognition.start();
                        console.log('recognition.start()が呼ばれました');
                    } catch (e) {
                        console.error('音声認識開始エラー:', e);
                        alert('音声認識の開始に失敗しました: ' + e.message);
                    }
                } else {
                    alert('音声認識が利用できません。Google Chromeブラウザをお使いください。');
                }
                
                // ビジュアライザー表示
                visualizerContainer.classList.add('active');
                visualize();
                
                startBtn.disabled = true;
                stopBtn.disabled = false;
                status.textContent = '🔴 録音・文字起こし中...';
                status.classList.add('recording');
                
                if (transcriptCount === 0) {
                    transcriptionArea.innerHTML = '';
                }
            } catch (err) {
                console.error('マイクへのアクセスエラー:', err);
                alert('マイクへのアクセスが拒否されました。ブラウザの設定を確認してください。');
                status.textContent = 'エラー: マイクにアクセスできません';
            }
        });
        
        // 停止
        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                
                if (recognition) {
                    recognition.stop();
                }
                
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
                
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                
                if (audioContext) {
                    audioContext.close();
                }
                
                visualizerContainer.classList.remove('active');
                volumeFill.style.width = '0%';
                
                startBtn.disabled = false;
                stopBtn.disabled = true;
                status.textContent = '停止しました';
                status.classList.remove('recording');
            }
        });
        
        // クリア
        clearBtn.addEventListener('click', () => {
            transcriptionArea.innerHTML = '<div class="empty-message">録音・文字起こし開始ボタンを押してください</div>';
            transcriptCount = 0;
            audioChunks = [];
        });
        
        // 簡易翻訳関数
        function translateToEnglish(japaneseText) {
            const translations = {
                'こんにちは': 'Hello',
                'おはよう': 'Good morning',
                'こんばんは': 'Good evening',
                'ありがとう': 'Thank you',
                'ありがとうございます': 'Thank you very much',
                'さようなら': 'Goodbye',
                'はい': 'Yes',
                'いいえ': 'No',
                'すみません': 'Excuse me',
                'お願いします': 'Please',
                'どういたしまして': 'You\'re welcome'
            };
            
            let result = japaneseText;
            for (let [jp, en] of Object.entries(translations)) {
                result = result.replace(new RegExp(jp, 'g'), en);
            }
            
            if (result === japaneseText) {
                return `[Translation: ${japaneseText}]`;
            }
            
            return result;
        }
        
        // 文字起こし結果を表示
        let interimElement = null;
        function displayTranscript(text, index, isInterim) {
            const englishText = translateToEnglish(text);
            
            if (isInterim) {
                if (!interimElement) {
                    interimElement = document.createElement('div');
                    interimElement.className = 'transcript-item interim';
                    transcriptionArea.appendChild(interimElement);
                }
                interimElement.innerHTML = `
                    <div class="japanese">${text}</div>
                    <div class="english">${englishText}</div>
                `;
            } else {
                if (interimElement) {
                    interimElement.remove();
                    interimElement = null;
                }
                
                const item = document.createElement('div');
                item.className = 'transcript-item';
                item.innerHTML = `
                    <div class="japanese">${text}</div>
                    <div class="english">${englishText}</div>
                `;
                
                transcriptionArea.appendChild(item);
                transcriptionArea.scrollTop = transcriptionArea.scrollHeight;
            }
        }
    </script>
</body>
</html>
